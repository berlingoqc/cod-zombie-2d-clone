[package]
name = "cod-zombie-2d-clone"
authors = ["William Quintal <william95quintalwilliam@outlook.com>"]
version = "0.1.0"
edition = "2021"

[features]
default = [
    "bevy/bevy_winit",
    "bevy/png"
]

native = [
    "bevy/x11"
    #"bevy/filesystem_watcher"
]

atlas = []

audio = [
    "bevy/bevy_audio",
    "bevy/vorbis"
]

[source.vendored-sources]
directory = "vendor"


[dependencies]
bevy = {version = "0.14.0", features = ["bevy_render","bevy_core_pipeline","bevy_sprite", "bevy_gilrs"]}
bevy_kira_audio = { git = "https://github.com/NiklasEi/bevy_kira_audio", branch = "main", features = ["ogg"] }

bytemuck = {version="1.19.0", features= ["derive"]}
ggrs = { version = "0.10.2", features=["sync-send"] }
bevy_ggrs = "0.16"
matchbox_socket = { version = "0.10.0", features = ["ggrs"] }

approx = "0.5.1"

ron = "0.8.1"
serde = { version = "1", features = ["derive"] }
rand = "0.8.5"
# structopt = "0.3"
anyhow ="1.0"
pathfinding = "3.0.12"
thiserror = "2.0.3"

console_error_panic_hook = "0.1.6"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_ggrs = { version = "0.16", features=["wasm-bindgen"]}
gloo-events = "0.2.0"
web-sys = "0.3.72"
